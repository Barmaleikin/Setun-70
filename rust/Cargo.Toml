[package]
name = "setun70"
version = "0.1.0"
edition = "2024"
build = "build.rs"
description = "Emulator of the Setun-70 ternary computer (per the algorithmic description, rotaprint 27-VT (417), MSU 1970)"
license = "MIT OR Apache-2.0"

[dependencies]
# Architecture-neutral ternary core. Default width (6 trits) is used.
analemma = { path = "../analemma-core" }
